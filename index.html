<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ozemre0 | Portfolio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      line-height: 1.6;
    }

    /* ── Header ── */
    header {
      text-align: center;
      padding: 5rem 1rem 3rem;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 1px solid #1e293b;
    }

    header h1 {
      font-size: 2.8rem;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.5px;
    }

    header p.subtitle {
      margin-top: 0.75rem;
      font-size: 1.1rem;
      color: #94a3b8;
      max-width: 540px;
      margin-inline: auto;
    }

    .social-links {
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .social-links a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.95rem;
      border: 1px solid #38bdf8;
      padding: 0.35rem 0.9rem;
      border-radius: 9999px;
      transition: background 0.2s, color 0.2s;
    }

    .social-links a:hover {
      background: #38bdf8;
      color: #0f172a;
    }

    /* ── Main ── */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
    }

    main h2 {
      font-size: 1.75rem;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 2rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid #1e293b;
    }

    /* ── Project Grid ── */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .card-icon {
      font-size: 1.4rem;
    }

    .card h3 {
      font-size: 1.15rem;
      font-weight: 600;
      color: #f1f5f9;
    }

    .card p {
      font-size: 0.9rem;
      color: #94a3b8;
      flex: 1;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .tag {
      font-size: 0.75rem;
      background: #0f172a;
      color: #7dd3fc;
      border: 1px solid #334155;
      border-radius: 9999px;
      padding: 0.2rem 0.65rem;
    }

    .card-link {
      display: inline-block;
      margin-top: 0.25rem;
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .card-link:hover { text-decoration: underline; }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 1.5rem;
      color: #475569;
      font-size: 0.85rem;
      border-top: 1px solid #1e293b;
    }
  </style>
</head>
<body>

  <header>
    <h1>ozemre0's Portfolio</h1>
    <p class="subtitle">
      A collection of projects I've built — from web apps to tools and experiments.
    </p>
    <nav class="social-links">
      <a href="https://github.com/ozemre0" target="_blank" rel="noopener noreferrer">GitHub</a>
    </nav>
  </header>

  <main>
    <h2>Projects</h2>

    <div class="projects-grid">

      <div class="card">
        <div class="card-header">
          <span class="card-icon">🌐</span>
          <h3>Portfolio Website</h3>
        </div>
        <p>This very site — a GitHub Pages portfolio showcasing my work and projects.</p>
        <div class="tags">
          <span class="tag">HTML</span>
          <span class="tag">CSS</span>
          <span class="tag">GitHub Pages</span>
        </div>
        <a class="card-link" href="https://github.com/ozemre0/portfolio" target="_blank" rel="noopener noreferrer">
          View on GitHub →
        </a>
      </div>

      <!-- Add more project cards below by copying the block above -->

    </div>
  </main>

  <footer>
    <p>Built with ❤️ and hosted on GitHub Pages.</p>
  </footer>

</body>
</html>
